# Part I - deployed on EC2 (pulls the image from Docker Hub)
services:
  web:
    image: YOUR_DOCKERHUB_USERNAME/click2dine:latest   # must match the pushed image name
    container_name: click2dine-web
    ports:
      - "8081:80"            # host 8081 -> container 80
    environment:
      DB_HOST: db
      DB_USER: c2d_user
      DB_PASSWORD: c2d_pass
      DB_NAME: click2dine
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: click2dine-db
    ports:
      - "3307:3306"          # host 3307 -> container 3306
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: click2dine
      MYSQL_USER: c2d_user
      MYSQL_PASSWORD: c2d_pass
    volumes:
      - db_data:/var/lib/mysql                       # persistent data
      - ./db:/docker-entrypoint-initdb.d:ro          # loads the .sql schema on first start
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
